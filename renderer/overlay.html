<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="style.css">
  <title>Voxa notch</title>
</head>
<body class="notch-body">
  <main id="notch" class="notch" data-state="idle" data-visible="false" data-mode="agent">
    <header class="notch-head">
      <div class="brand-mini">
        <span class="mini-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 13h4l2-6 4 11 2-5h6"/></svg>
        </span>
        <div id="dots" class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
        <span id="levelMeter" class="level-meter" aria-label="Microphone level"><i></i><i></i><i></i><i></i><i></i></span>
        <span id="notchState">Idle</span>
      </div>
      <button id="stopButton" class="stop-button" type="button" aria-label="Stop recording or close">
        <i aria-hidden="true"></i>
      </button>
    </header>
    <section id="notchCard" class="notch-card" aria-live="polite">
      <div id="cardText" class="card-text"></div>
      <div id="approvalActions" class="approval-actions" hidden>
        <button id="denyButton" class="notch-button secondary" type="button">Deny</button>
        <button id="allowButton" class="notch-button primary" type="button">Allow</button>
      </div>
      <button id="copyButton" class="copy-button" type="button" hidden>Copy</button>
    </section>
  </main>
  <script src="overlay.js"></script>
</body>
</html>
