<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="island.css">
  <title>Voxa island</title>
</head>
<body class="notch-body">
  <div id="overlayStage" class="overlay-stage" data-style="island">
    <main id="notch" class="pill" data-state="idle" data-visible="false" data-mode="agent" data-style="island" data-size="compact">
      <div class="pill-glow" aria-hidden="true"></div>
      <div class="pill-surface" aria-hidden="true"></div>
      <div class="pill-clip">
        <div class="pill-content">
          <header class="pill-head">
            <span id="statusIcon" class="status-icon" aria-hidden="true">
              <svg class="glyph glyph-mark" viewBox="0 0 24 24"><path d="M3 13h4l2-6 4 11 2-5h6"/></svg>
              <svg class="glyph glyph-alert" viewBox="0 0 24 24"><path d="M12 3.8 2.9 20.2h18.2z"/><path d="M12 9v5.2m0 2.9v.1"/></svg>
              <svg class="glyph glyph-check" viewBox="0 0 24 24"><path d="m5 12.6 4.5 4.5L19 7.4"/></svg>
              <span id="dots" class="dots"><i></i><i></i><i></i></span>
              <span id="companion" class="companion" aria-hidden="true">
                <svg class="companion-svg" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
                  <g class="companion-body">
                    <path class="companion-shell" d="M16 5.4c4.9 0 8.4 3.4 8.4 8.5 0 6.1-3.6 11.8-8.4 11.8s-8.4-5.7-8.4-11.8c0-5.1 3.5-8.5 8.4-8.5Z"/>
                    <path class="companion-highlight" d="M10.4 11.4c.5-2.5 2.1-4.1 4.5-4.8-1.7 1-2.8 2.6-3.2 5-.2 1-1.5.8-1.3-.2Z"/>
                    <path class="companion-stem" d="M16 5.7c.1-1.5.7-2.6 1.8-3.4"/>
                    <path class="companion-leaf" d="M17.5 2.8c1.3-.7 2.6-.5 3.7.5-1.2.9-2.5 1-3.8.3Z"/>
                    <g class="companion-face">
                      <g class="companion-eyes companion-eyes-open">
                        <g class="companion-eye companion-eye-left">
                          <ellipse class="companion-eye-white" cx="12.4" cy="14.7" rx="2.7" ry="3.1"/>
                          <circle class="companion-pupil" cx="12.4" cy="15" r="1.8"/>
                          <circle class="companion-glint" cx="11.8" cy="14.2" r=".55"/>
                        </g>
                        <g class="companion-eye companion-eye-right">
                          <ellipse class="companion-eye-white" cx="19.6" cy="14.7" rx="2.7" ry="3.1"/>
                          <circle class="companion-pupil" cx="19.6" cy="15" r="1.8"/>
                          <circle class="companion-glint" cx="19" cy="14.2" r=".55"/>
                        </g>
                      </g>
                      <g class="companion-eyes companion-eyes-happy">
                        <path d="M10.5 15.3c.9-1.2 2-1.2 2.9 0"/>
                        <path d="M18.6 15.3c.9-1.2 2-1.2 2.9 0"/>
                      </g>
                      <g class="companion-brows">
                        <path d="M10.3 12.2l2.6-.8"/>
                        <path d="M21.7 12.2l-2.6-.8"/>
                      </g>
                      <g class="companion-mouths">
                        <path class="companion-mouth companion-mouth-idle" d="M14.5 20.2c.8.7 2.2.7 3 0"/>
                        <ellipse class="companion-mouth companion-mouth-listen" cx="16" cy="20.7" rx="1.3" ry="1.5"/>
                        <ellipse class="companion-mouth companion-mouth-speak" cx="16" cy="20.7" rx="1.8" ry="1.25"/>
                        <path class="companion-mouth companion-mouth-happy" d="M13.9 19.7c1.1 2 3.1 2 4.2 0"/>
                        <path class="companion-mouth companion-mouth-flat" d="M14.5 20.8h3"/>
                      </g>
                      <g class="companion-cheeks">
                        <ellipse cx="10.4" cy="19.6" rx="1.5" ry=".8"/>
                        <ellipse cx="21.6" cy="19.6" rx="1.5" ry=".8"/>
                      </g>
                    </g>
                    <g class="companion-thought">
                      <circle cx="23.4" cy="6.2" r=".85"/>
                      <circle cx="26.2" cy="4.3" r=".85"/>
                      <circle cx="28.8" cy="2.8" r=".85"/>
                    </g>
                    <g class="companion-sound">
                      <path d="M25.3 12.4c1.4 1.8 1.4 4.3 0 6.1"/>
                      <path d="M27.7 10.7c2.4 3 2.4 6.5 0 9.5"/>
                    </g>
                    <g class="companion-sparkle">
                      <path d="M7.4 5.6l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4L5.4 7.6l1.4-.6Z"/>
                      <path d="M25.4 7.2l.5 1.2 1.2.5-1.2.5-.5 1.2-.5-1.2-1.2-.5 1.2-.5Z"/>
                    </g>
                    <path class="companion-sweat" d="M23.4 6.7c-1 1.2-1.5 2-1.5 2.7a1.5 1.5 0 0 0 3 0c0-.7-.5-1.5-1.5-2.7Z"/>
                  </g>
                </svg>
              </span>
            </span>
            <div class="head-center">
              <span id="levelMeter" class="level-meter" aria-label="Microphone level"><i></i><i></i><i></i><i></i><i></i></span>
              <span id="notchState" class="state-label">Idle</span>
            </div>
            <div class="head-actions">
              <button id="chatButton" class="head-button chat-button" type="button" aria-label="Open chat" title="Ask Voxa">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6.5h14v9H9.5L5 19v-12.5z"/><path d="M8.5 10h7M8.5 12.8h4.5"/></svg>
              </button>
              <button id="chatCloseButton" class="head-button chat-close-button" type="button" aria-label="Collapse chat" title="Collapse chat" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 14.5 6-5 6 5"/></svg>
              </button>
              <button id="stopButton" class="stop-button" type="button" aria-label="Stop recording or close">
                <span class="stop-glyph" aria-hidden="true"></span>
              </button>
            </div>
          </header>
          <div class="pill-body">
            <section id="notchCard" class="pill-card" aria-live="polite">
              <div id="cardText" class="card-text"></div>
              <div class="card-actions">
                <div id="approvalActions" class="approval-actions" hidden>
                  <button id="denyButton" class="notch-button secondary" type="button">Deny <kbd>Esc</kbd></button>
                  <button id="allowButton" class="notch-button primary" type="button">Allow <kbd>Enter</kbd></button>
                </div>
                <button id="copyButton" class="copy-button" type="button" hidden>Copy</button>
                <button id="collapseButton" class="notch-button" type="button" aria-label="Collapse island" title="Collapse" hidden>Collapse</button>
              </div>
            </section>
            <section id="chatPanel" class="chat-panel" aria-label="Voxa chat" hidden>
              <div id="chatPreviewLabel" class="chat-preview-label" hidden>Preview only · messages are not sent</div>
              <div id="chatLog" class="chat-log" role="log" aria-live="polite" aria-relevant="additions text">
                <div id="chatEmpty" class="chat-empty">Ask Voxa anything. Typed chat can't perform desktop actions.</div>
              </div>
              <form id="chatForm" class="chat-composer" autocomplete="off">
                <label class="chat-label" for="chatInput">Message Voxa</label>
                <textarea id="chatInput" class="chat-input" rows="1" maxlength="8000" placeholder="Ask Voxa…" aria-label="Message Voxa"></textarea>
                <div class="chat-actions">
                  <span id="chatHint" class="chat-hint">Enter to send · Shift+Enter for a new line</span>
                  <button id="chatStopButton" class="chat-stop" type="button" hidden>Stop</button>
                  <button id="chatSendButton" class="chat-send" type="submit" aria-label="Send message" title="Send">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m0 0-5.5 5.5M12 5l5.5 5.5"/></svg>
                  </button>
                </div>
              </form>
              <div id="chatError" class="chat-error" role="alert" hidden></div>
            </section>
          </div>
        </div>
      </div>
      <div id="progressLine" class="progress-line" aria-hidden="true"><i></i></div>
    </main>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
