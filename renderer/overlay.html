<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="island.css">
  <title>Voxa island</title>
</head>
<body class="notch-body">
  <div id="overlayStage" class="overlay-stage" data-style="island">
    <main id="notch" class="pill" data-state="idle" data-visible="false" data-mode="agent" data-style="island" data-size="compact">
      <div class="pill-glow" aria-hidden="true"></div>
      <div class="pill-surface" aria-hidden="true"></div>
      <div class="pill-clip">
        <div class="pill-content">
          <header class="pill-head">
            <span id="statusIcon" class="status-icon" aria-hidden="true">
              <svg class="glyph glyph-mark" viewBox="0 0 24 24"><path d="M3 13h4l2-6 4 11 2-5h6"/></svg>
              <svg class="glyph glyph-media" viewBox="0 0 24 24"><circle cx="7" cy="17.5" r="2.1"/><circle cx="18" cy="16.5" r="2.1"/><path d="M9.1 17.5V6.4l11-2.3v12.4"/></svg>
              <svg class="glyph glyph-alert" viewBox="0 0 24 24"><path d="M12 3.8 2.9 20.2h18.2z"/><path d="M12 9v5.2m0 2.9v.1"/></svg>
              <svg class="glyph glyph-check" viewBox="0 0 24 24"><path d="m5 12.6 4.5 4.5L19 7.4"/></svg>
              <span id="dots" class="dots"><i></i><i></i><i></i></span>
              <span id="companion" class="companion" data-expression="idle" aria-hidden="true">
                <span class="blob">
                  <span class="blob-body"></span>
                  <svg class="blob-face" viewBox="0 0 38 42" aria-hidden="true" focusable="false">
                    <circle class="blob-cheek blob-cheek-l" cx="6.2" cy="27" r="2.8"/>
                    <circle class="blob-cheek blob-cheek-r" cx="31.8" cy="27" r="2.8"/>
                    <ellipse class="blob-mouth" cx="19" cy="29.5" rx="3.6" ry="4.4"/>
                    <path class="blob-smile" d="M15.2 28.6q3.8 3.6 7.6 0"/>
                  </svg>
                  <span class="blob-eyes">
                    <span class="blob-eye blob-eye-l"></span>
                    <span class="blob-eye blob-eye-r"></span>
                  </span>
                  <svg class="blob-variant blob-variant-happy" viewBox="0 0 38 16" aria-hidden="true" focusable="false">
                    <path d="M7.6 10.8q4.2-6 8.4 0"/>
                    <path d="M22 10.8q4.2-6 8.4 0"/>
                  </svg>
                  <svg class="blob-variant blob-variant-hard" viewBox="0 0 38 16" aria-hidden="true" focusable="false">
                    <path d="m8 6.4 8 8M16 6.4l-8 8"/>
                    <path d="m22.4 6.4 8 8M30.4 6.4l-8 8"/>
                  </svg>
                  <svg class="blob-variant blob-variant-dizzy" viewBox="0 0 38 16" aria-hidden="true" focusable="false">
                    <path d="M11.8 10.4a1.5 1.5 0 1 1-2.9-.5 2.7 2.7 0 1 1 5.3.8 4 4 0 1 1-7.9-.8"/>
                    <path d="M29 10.4a1.5 1.5 0 1 1-2.9-.5 2.7 2.7 0 1 1 5.3.8 4 4 0 1 1-7.9-.8"/>
                  </svg>
                </span>
              </span>
            </span>
            <div class="head-center">
              <span id="levelMeter" class="level-meter" aria-label="Microphone level"><canvas id="spectrumCanvas" class="meter-canvas" width="88" height="30" aria-hidden="true"></canvas></span>
              <span id="notchState" class="state-label">Idle</span>
              <span id="mediaPanel" class="media-panel" aria-label="Now playing" hidden>
                <span id="mediaTitle" class="media-title"></span>
                <span id="mediaArtist" class="media-artist"></span>
              </span>
            </div>
            <div class="head-actions">
              <div id="mediaControls" class="media-controls" aria-label="Playback controls" hidden>
                <button id="mediaPrev" class="head-button media-btn" type="button" aria-label="Previous track" title="Previous">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 5.5v13L9 12z"/><path d="M6.5 6v12"/></svg>
                </button>
                <button id="mediaPlay" class="head-button media-btn media-play" type="button" aria-label="Play or pause" title="Play or pause">
                  <svg class="glyph-media-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.6v12.8L18.5 12z"/></svg>
                  <svg class="glyph-media-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 6v12"/><path d="M15.5 6v12"/></svg>
                </button>
                <button id="mediaNext" class="head-button media-btn" type="button" aria-label="Next track" title="Next">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 5.5v13L15 12z"/><path d="M17.5 6v12"/></svg>
                </button>
              </div>
              <button id="chatButton" class="head-button chat-button" type="button" aria-label="Open chat" title="Ask Voxa">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6.5h14v9H9.5L5 19v-12.5z"/><path d="M8.5 10h7M8.5 12.8h4.5"/></svg>
              </button>
              <button id="chatCloseButton" class="head-button chat-close-button" type="button" aria-label="Collapse chat" title="Collapse chat" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 14.5 6-5 6 5"/></svg>
              </button>
              <button id="stopButton" class="stop-button" type="button" aria-label="Stop recording or close">
                <span class="stop-glyph" aria-hidden="true"></span>
              </button>
            </div>
          </header>
          <div class="pill-body">
            <section id="notchCard" class="pill-card" aria-live="polite">
              <div id="cardText" class="card-text"></div>
              <div class="card-actions">
                <div id="approvalActions" class="approval-actions" hidden>
                  <button id="denyButton" class="notch-button secondary" type="button">Deny <kbd>Esc</kbd></button>
                  <button id="allowButton" class="notch-button primary" type="button">Allow <kbd>Enter</kbd></button>
                </div>
                <button id="copyButton" class="copy-button" type="button" hidden>Copy</button>
                <button id="collapseButton" class="notch-button" type="button" aria-label="Collapse island" title="Collapse" hidden>Collapse</button>
              </div>
            </section>
            <section id="chatPanel" class="chat-panel" aria-label="Voxa chat" hidden>
              <div id="chatPreviewLabel" class="chat-preview-label" hidden>Preview only · messages are not sent</div>
              <div id="chatLog" class="chat-log" role="log" aria-live="polite" aria-relevant="additions text">
                <div id="chatEmpty" class="chat-empty">Ask Voxa anything. Typed chat can't perform desktop actions.</div>
              </div>
              <form id="chatForm" class="chat-composer" autocomplete="off">
                <label class="chat-label" for="chatInput">Message Voxa</label>
                <textarea id="chatInput" class="chat-input" rows="1" maxlength="8000" placeholder="Ask Voxa…" aria-label="Message Voxa"></textarea>
                <div class="chat-actions">
                  <span id="chatHint" class="chat-hint">Enter to send · Shift+Enter for a new line</span>
                  <button id="chatStopButton" class="chat-stop" type="button" hidden>Stop</button>
                  <button id="chatSendButton" class="chat-send" type="submit" aria-label="Send message" title="Send">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m0 0-5.5 5.5M12 5l5.5 5.5"/></svg>
                  </button>
                </div>
              </form>
              <div id="chatError" class="chat-error" role="alert" hidden></div>
            </section>
            <section id="feedPanel" class="pill-feed" aria-label="Voxa alerts" hidden>
              <div class="feed-head">
                <span class="feed-title">Alerts</span>
                <span id="feedCount" class="feed-count">All clear</span>
              </div>
              <div id="feedPreviewLabel" class="feed-preview-label" hidden>Preview only · sample alerts</div>
              <div id="feedList" class="feed-list" role="list"></div>
              <div id="feedEmpty" class="feed-empty">No alerts right now. Voxa events like turn results and downloads land here.</div>
            </section>
          </div>
        </div>
      </div>
      <div id="progressLine" class="progress-line" aria-hidden="true"><i></i></div>
    </main>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
