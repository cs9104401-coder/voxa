<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="dashboard.css">
<title></title>
</head>
<body class="dashboard-body">
<div class="drag-strip"></div>

<div class="window-controls">
  <button data-window="minimize" aria-label="Minimize"></button>
  <button data-window="maximize" aria-label="Maximize"></button>
  <button data-window="close" aria-label="Close"></button>
</div>

<div class="dashboard-shell">

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark"><svg viewBox="0 0 32 32"><path d="M5 17h5l3-8 6 15 3-7h5"/></svg></span>
      <span id="brandName"></span>
      <span class="tier-badge" id="tierBadge">LOCAL</span>
    </div>

    <nav id="nav" aria-label="Primary">
      <div class="nav-group">
        <span class="nav-group-label" aria-hidden="true">Workspace</span>
        <button class="nav-item active" data-page="dashboard" aria-label="Home" title="Home">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></svg>
          <span class="nav-text">Home</span>
        </button>
        <button class="nav-item" data-page="agent" aria-label="Agent" title="Agent">
          <svg viewBox="0 0 24 24"><path d="M12 3v3m0 12v3M4 8h4m8 0h4M4 16h4m8 0h4"/><circle cx="12" cy="12" r="5"/></svg>
          <span class="nav-text">Agent</span>
        </button>
        <button class="nav-item" data-page="dictation" aria-label="Dictation" title="Dictation">
          <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3m-4 0h8"/></svg>
          <span class="nav-text">Dictation</span>
        </button>
        <button class="nav-item" data-page="history" aria-label="History" title="History">
          <svg viewBox="0 0 24 24"><path d="M4 5h16v16H4zM8 3v4m8-4v4M4 10h16"/></svg>
          <span class="nav-text">History</span>
        </button>
      </div>
      <div class="nav-group">
        <span class="nav-group-label" aria-hidden="true">System</span>
        <button class="nav-item" data-page="insights" aria-label="Insights" title="Insights">
          <svg viewBox="0 0 24 24"><path d="M3 20V5m0 15h18M7 16l4-5 3 2 6-8"/></svg>
          <span class="nav-text">Insights</span>
        </button>
        <button class="nav-item" data-page="apps" aria-label="Apps" title="Apps">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
          <span class="nav-text">Apps</span>
        </button>
        <button class="nav-item" data-page="logs" aria-label="Logs" title="Logs">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          <span class="nav-text">Logs</span>
        </button>
        <button class="nav-item" data-page="settings" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24"><path d="M4 8h10M18 8h2M4 16h2M10 16h10"/><circle cx="16" cy="8" r="2"/><circle cx="8" cy="16" r="2"/></svg>
          <span class="nav-text">Settings</span>
        </button>
      </div>
    </nav>

    <div class="sidebar-bottom">
      <a id="community" class="community" target="_blank" rel="noreferrer" hidden>
        <span class="icon-chip" aria-hidden="true">+</span>
        <span class="nav-text">Join community</span>
      </a>
      <button id="userMenu" class="user-chip" aria-haspopup="menu" aria-expanded="false">
        <span class="avatar" id="sideAvatar">V</span>
        <span class="user-copy">
          <b id="sideName">User</b>
          <small id="sidePlan">Personal workspace</small>
        </span>
        <span class="chevron" aria-hidden="true"></span>
      </button>
      <div id="userDropdown" class="user-dropdown" hidden role="menu">
        <button data-menu="settings" role="menuitem">Settings</button>
        <button data-menu="about" role="menuitem">About</button>
        <button data-menu="quit" role="menuitem">Quit</button>
      </div>
    </div>
  </aside>

  <main class="content-frame">
    <header class="page-top">
      <div class="eyebrow">Personal voice workspace</div>
      <div class="top-actions">
        <span class="service-dot" id="appStatus"></span>
        <span id="appStatusText">Local and ready</span>
      </div>
    </header>

    <div class="page-scroll">
      <section class="page active" id="page-dashboard"></section>
      <section class="page" id="page-insights"></section>
      <section class="page" id="page-history"></section>
      <section class="page" id="page-dictation"></section>
      <section class="page" id="page-agent"></section>
      <section class="page" id="page-apps"></section>
      <section class="page" id="page-logs"></section>
      <section class="page" id="page-settings"></section>
      <section class="page" id="page-about"></section>
    </div>

    <footer class="voice-dock" aria-label="Voice dock">
      <div class="dock-status">
        <span class="service-dot" id="appStatus"></span>
        <span id="appStatusText">Local and ready</span>
      </div>
      <span class="dock-sep" aria-hidden="true"></span>
      <button id="talkNow" class="button primary talk-now" aria-label="Talk now">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3m-4 0h8"/></svg>
        <span>Talk now</span>
      </button>
      <div class="dock-hint" id="dockHint" aria-hidden="true"></div>
    </footer>
  </main>

</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="dashboard.js"></script>
<script src="tts-player.js"></script>

</body>
</html>
